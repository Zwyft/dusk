name: Build

on:
  push:
    paths-ignore:
      - '*.md'
      - '*LICENSE'
  pull_request:

permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTC_WRAPPER: "sccache"
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

jobs:
  build-linux:
    name: Build Linux (${{matrix.name}})
    runs-on: ${{matrix.runner}}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC x86_64
            runner: ubuntu-24.04
            preset: gcc
            artifact_arch: x86_64

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Rust
        run: |
          rustup toolchain install stable
          rustup default stable

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libfuse2 \
            libcurl4-openssl-dev libssl-dev libglu1-mesa-dev libasound2-dev \
            libpulse-dev libudev-dev libx11-xcb-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libdbus-1-dev libpng-dev \
            libvulkan-dev zlib1g-dev libfreetype-dev libgtk-3-dev \
            libdecor-0-dev libpipewire-0.3-dev libunwind-dev \
            libusb-1.0-0-dev libxss-dev

      - name: Patch aurora
        run: python3 ci/patch-aurora.py

      - name: Restore sccache cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-linux-v2-${{ github.sha }}
          restore-keys: |
            sccache-linux-v2-

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure CMake
        run: cmake --preset x-linux-ci-${{matrix.preset}}

      - name: Build
        run: cmake --build --preset x-linux-ci-${{matrix.preset}}

      - name: Print sccache stats
        run: sccache --show-stats

      - name: Generate AppImage
        run: ci/build-appimage.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusk-${{env.DUSK_VERSION}}-linux-${{matrix.preset}}-${{matrix.artifact_arch}}
          path: |
            build/install/Dusk-*.AppImage
            build/install/debug.tar.*

  build-apple:
    name: Build Apple (${{matrix.name}})
    runs-on: ${{matrix.runner}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AppleClang macOS arm64
            runner: macos-15
            platform: macos
            preset: x-macos-ci-arm64
            artifact_name: macos-appleclang-arm64

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Patch aurora (saves folder)
        run: python3 ci/patch-aurora.py

      - name: Patch aurora (macOS lacks std::atomic_ref)
        run: |
          sed -i '' '/static std::atomic_ref/d' extern/aurora/lib/gfx/pipeline_cache.cpp
          sed -i '' 's/++queuedPipelines/++g_stats.queuedPipelines/g' extern/aurora/lib/gfx/pipeline_cache.cpp
          sed -i '' 's/--queuedPipelines/--g_stats.queuedPipelines/g' extern/aurora/lib/gfx/pipeline_cache.cpp
          sed -i '' 's/++createdPipelines/++g_stats.createdPipelines/g' extern/aurora/lib/gfx/pipeline_cache.cpp
          sed -i '' 's/queuedPipelines = 0/g_stats.queuedPipelines = 0/g' extern/aurora/lib/gfx/pipeline_cache.cpp
          sed -i '' 's/createdPipelines = 0/g_stats.createdPipelines = 0/g' extern/aurora/lib/gfx/pipeline_cache.cpp

      - name: Restore sccache cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-macos-v2-${{ github.sha }}
          restore-keys: |
            sccache-macos-v2-

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure CMake
        run: cmake --preset ${{matrix.preset}}

      - name: Build
        run: cmake --build --preset ${{matrix.preset}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusk-${{env.DUSK_VERSION}}-${{matrix.artifact_name}}
          path: |
            build/install/Dusk.app
            build/install/debug.tar.*

  build-windows:
    name: Build Windows (${{matrix.name}})
    runs-on: ${{matrix.runner}}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC x86_64
            runner: windows-2022
            preset: msvc
            msvc_arch: amd64
            vcpkg_arch: x64
            artifact_arch: x86_64

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Enable Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{matrix.msvc_arch}}

      - name: Override VCPKG_ROOT
        run: echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Patch aurora
        run: python3 ci/patch-aurora.py

      - name: Restore sccache cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-windows-v2-${{ github.sha }}
          restore-keys: |
            sccache-windows-v2-

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install dependencies
        run: vcpkg install freetype:${{matrix.vcpkg_arch}}-windows-static zstd:${{matrix.vcpkg_arch}}-windows-static

      - name: Configure CMake
        run: cmake --preset x-windows-ci-${{matrix.preset}}

      - name: Build
        run: cmake --build --preset x-windows-ci-${{matrix.preset}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusk-${{env.DUSK_VERSION}}-win32-msvc-${{matrix.artifact_arch}}
          path: |
            build/install/*.exe
            build/install/*.dll
            build/install/res/
            build/install/debug.7z

  build-android:
    name: Build Android (arm64-v8a)
    runs-on: ubuntu-24.04
    env:
      ANDROID_NDK_VERSION: 29.0.14206865
      RUSTC_WRAPPER:
      ANDROID_STAGE_STRIP: 1
      ANDROID_STAGE_ABIS: arm64-v8a
      CMAKE_BUILD_PARALLEL_LEVEL: 12

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build

      - name: Install Rust Android targets
        run: |
          rustup target add aarch64-linux-android

      - name: Restore sccache cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-android-v2-${{ github.sha }}
          restore-keys: |
            sccache-android-v2-

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-v2-${{ hashFiles('platforms/android/**/*.gradle*', 'platforms/android/gradle.properties', 'platforms/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-android-v2-

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure CMake
        run: cmake --preset x-android-ci-arm64

      - name: Build native libs (arm64-v8a)
        run: cmake --build --preset x-android-ci-arm64

      - name: Print sccache stats
        run: sccache --show-stats

      - name: Stage JNI libs
        run: ./platforms/android/scripts/stage-jni-libs.sh

      - name: Assemble APK
        working-directory: platforms/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --build-cache syncDuskAssets :app:assembleDebug

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusk-${{env.DUSK_VERSION}}-android
          path: platforms/android/app/build/outputs/apk/debug/*.apk

  build-switch:
    name: Build Switch (experimental)
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    env:
      RUSTC_WRAPPER:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkita64

    steps:
      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y cmake make python3 build-essential

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Patch aurora
        run: python3 ci/patch-aurora.py

      - name: Configure Switch CMake
        run: |
          cmake --preset switch-libnx-relwithdebinfo -G "Unix Makefiles"

      - name: Build Switch
        run: cmake --build --preset switch-libnx-relwithdebinfo

      - name: Package Switch NRO
        run: |
          BUILD_DIR=build/switch-libnx-relwithdebinfo
          $DEVKITPRO/tools/bin/nacptool --create "Dusk" "Dusk" "${{env.DUSK_VERSION}}" $BUILD_DIR/dusk.nacp
          $DEVKITPRO/tools/bin/elf2nro $BUILD_DIR/dusk $BUILD_DIR/dusk.nro --nacp=$BUILD_DIR/dusk.nacp --romfsdir=res

      - name: Stage Switch upload payloads
        run: |
          BUILD_DIR=build/switch-libnx-relwithdebinfo
          ARTIFACT_DIR=$BUILD_DIR/upload-artifacts
          BUNDLE_DIR=$BUILD_DIR/upload-bundle
          mkdir -p $ARTIFACT_DIR $BUNDLE_DIR/sdmc/switch/dusk $BUNDLE_DIR/sdmc/dusk

          cp $BUILD_DIR/dusk.nro $ARTIFACT_DIR/dusk.nro
          cp $BUILD_DIR/dusk.nacp $ARTIFACT_DIR/dusk.nacp
          cp -r res $ARTIFACT_DIR/res

          cp $BUILD_DIR/dusk.nro $BUNDLE_DIR/sdmc/switch/dusk/dusk.nro
          cp $BUILD_DIR/dusk.nacp $BUNDLE_DIR/sdmc/switch/dusk/dusk.nacp
          cp -r res $BUNDLE_DIR/sdmc/dusk/res

          echo "Switch install layout (copy CONTENTS of this sdmc folder to your SD card root):" > $BUNDLE_DIR/INSTALL.txt
          echo "  sdmc:/switch/dusk/dusk.nro" >> $BUNDLE_DIR/INSTALL.txt
          echo "  sdmc:/switch/dusk/dusk.nacp (optional)" >> $BUNDLE_DIR/INSTALL.txt
          echo "  sdmc:/dusk/res/... (runtime resources)" >> $BUNDLE_DIR/INSTALL.txt
          echo "  sdmc:/aurora/ (created for app data/logs)" >> $BUNDLE_DIR/INSTALL.txt

      - name: Upload Switch artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusk-${{env.DUSK_VERSION}}-switch-experimental
          path: build/switch-libnx-relwithdebinfo/upload-artifacts

      - name: Upload Switch bundle
        uses: actions/upload-artifact@v7
        with:
          name: dusk-${{env.DUSK_VERSION}}-switch-bundle
          path: build/switch-libnx-relwithdebinfo/upload-bundle
